name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore WPF application
        run: dotnet restore HelpDesk-System.csproj

      - name: Restore database migrator
        run: dotnet restore HelpDesk.DatabaseMigrator/HelpDesk.DatabaseMigrator.csproj

      - name: Build WPF application
        run: >-
          dotnet build HelpDesk-System.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Build database migrator
        run: >-
          dotnet build HelpDesk.DatabaseMigrator/HelpDesk.DatabaseMigrator.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
