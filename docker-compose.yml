services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_password
    ports:
      - "5432:5432"
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: Docker/Migrations.Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=helpdesk;Username=helpdesk_user;Password=helpdesk_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  helpdesk-data:
